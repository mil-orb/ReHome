version: 2

# Updates wait two weeks after a release before they're proposed, so a compromised version has time to be caught
# upstream first. Same rule as adding a dependency by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # The SDK is pinned exactly in global.json so CI and local builds resolve the same packages.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /src/Rehome.App/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
