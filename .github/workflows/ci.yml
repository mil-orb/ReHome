name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs, at least two weeks old when picked. Dependabot proposes bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Rehome.App/ui/package-lock.json

      # Exact versions from the lock files. Install scripts off: no package gets to run code on the runner.
      - name: Install UI dependencies
        working-directory: src/Rehome.App/ui
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Typecheck UI
        working-directory: src/Rehome.App/ui
        run: npm run typecheck

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Test
        run: dotnet test --no-restore -c Release

      - name: Publish portable exe
        run: dotnet publish src/Rehome.App -c Release -o out --no-restore

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/Rehome.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Rehome.exe" | Set-Content -NoNewline out/SHA256SUMS.txt
          "Rehome.exe SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Rehome
          path: |
            out/Rehome.exe
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
