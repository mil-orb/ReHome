name: release

# Started by hand from main. Builds, tests and leaves a draft release to review before publishing.
# The build runs with read-only access; only the last job, which runs gh and nothing from npm, can write.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $v) { throw "No <Version> in Directory.Build.props" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install UI dependencies
        working-directory: src/Rehome.App/ui
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Test
        run: |
          dotnet restore --locked-mode
          dotnet test --no-restore -c Release

      - name: Publish
        run: dotnet publish src/Rehome.App -c Release -o out --no-restore

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/ReHome.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ReHome.exe" | Set-Content -NoNewline out/SHA256SUMS.txt

      # The exe isn't code-signed yet. Signing goes here, before the checksum, once there's a certificate.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out/ReHome.exe
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v$VERSION" out/ReHome.exe out/SHA256SUMS.txt --draft --generate-notes --title "ReHome $VERSION" --target "$GITHUB_SHA"
