name: release

# Started by hand. Builds from the tagged commit and leaves a draft release to review before publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $v) { throw "No <Version> in Directory.Build.props" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install UI dependencies
        working-directory: src/Rehome.App/ui
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Test
        run: |
          dotnet restore --locked-mode
          dotnet test --no-restore -c Release

      - name: Publish
        run: dotnet publish src/Rehome.App -c Release -o out --no-restore

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/Rehome.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Rehome.exe" | Set-Content -NoNewline out/SHA256SUMS.txt

      # The exe isn't code-signed yet. Signing goes here, before the checksum, once there's a certificate.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$env:VERSION" out/Rehome.exe out/SHA256SUMS.txt --draft --generate-notes --title "Rehome $env:VERSION" --target "$env:GITHUB_SHA"
