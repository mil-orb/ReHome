<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Rehome">
  <!-- Rehome's mark: a house of app tiles, the last one dropping into place. 32 px and up; logo-small.svg below that.
       The window's start screen draws the same shapes (Logo in ui/src/App.tsx). Run `npm run icon` after changing. -->
  <defs>
    <linearGradient id="rehome-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8079f2"/>
      <stop offset="1" stop-color="#4a42c6"/>
    </linearGradient>
    <linearGradient id="rehome-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#rehome-bg)"/>
  <rect width="256" height="256" rx="60" fill="url(#rehome-sheen)"/>
  <path d="M128 46 L210 116 H190 V194 a16 16 0 0 1 -16 16 H82 a16 16 0 0 1 -16 -16 V116 H46 Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <g fill="#5850d8">
    <rect x="94" y="122" width="31" height="31" rx="8"/>
    <rect x="94" y="159" width="31" height="31" rx="8"/>
    <rect x="131" y="159" width="31" height="31" rx="8"/>
    <rect x="131" y="122" width="31" height="31" rx="8" opacity=".38"/>
    <rect x="139" y="108" width="31" height="31" rx="8" transform="rotate(12 154.5 123.5)"/>
  </g>
</svg>
