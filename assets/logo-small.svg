  </defs>
  <rect width="256" height="256" rx="56" fill="url(#rehome-bg)"/>
  <path d="M128 40 L216 114 H194 V198 a16 16 0 0 1 -16 16 H78 a16 16 0 0 1 -16 -16 V114 H40 Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  <g fill="#5850d8">
